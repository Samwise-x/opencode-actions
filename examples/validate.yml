name: candidate-validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: candidate-validation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: CargoWall
        uses: code-cargo/cargowall-action@7943209964cc5472fee8aa1e02cde8a2f0dd0414
        with:
          mode: enforce
          offline: true
          fail-on-unsupported: true
          sudo-lockdown: true
          allowed-hosts: ${{ vars.CI_ALLOWED_HOSTS }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Repository validation graph
        run: nix develop --command ./ci/validate

      - name: Zizmor
        uses: zizmorcore/zizmor-action@a91218c45134530ecc7aefc3eec3f997a279ad37
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          online-audits: false

      - name: Trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Install Cosign
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a

      - name: Verify Cosign
        run: cosign version
