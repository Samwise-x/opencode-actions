name: opencode-admit

on:
  workflow_run:
    workflows: ["opencode-frontier"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: opencode-admission-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admit:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download frontier evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: opencode-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - id: evidence
        name: Resolve exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/evidence.json
          echo "candidate_sha=$(jq -r .candidate_sha evidence/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r .pr_number evidence/evidence.json)" >> "$GITHUB_OUTPUT"

      # Replace v1 with the immutable commit SHA deployed from this repository.
      - name: Deterministically admit candidate
        uses: Samwise-x/opencode-actions/admit@v1
        with:
          pr-number: ${{ steps.evidence.outputs.pr_number }}
          candidate-sha: ${{ steps.evidence.outputs.candidate_sha }}
          evidence-file: evidence/evidence.json
          required-checks: ${{ vars.OPENCODE_REQUIRED_CHECKS }}
          merge-method: squash
