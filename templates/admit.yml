name: OpenCode Admission

on:
  workflow_run:
    workflows: ["OpenCode Candidate Validation"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: opencode-admission-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'opencode/issue-') &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download sealed qualification from validation run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: opencode-qualified-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/qualified
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Admit exact candidate with deterministic CAS
        uses: Samwise-x/opencode-actions/admit@__IMPLEMENTATION_SHA__
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          candidate-sha: ${{ github.event.workflow_run.head_sha }}
          qualification-file: ${{ runner.temp }}/qualified/qualification.json
          bundle-file: ${{ runner.temp }}/qualified/qualification.sigstore.json
          protected-paths-file: .opencode-actions/protected-paths.txt
          required-checks: deterministic,security
          validation-workflow: .github/workflows/opencode-candidate-validation.yml
          token: ${{ secrets.ADMISSION_TOKEN }}
