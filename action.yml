name: OpenCode Frontier Worker
description: Deterministic rotating OpenCode worker with CAS trajectory and SHA-bound evidence.
branding:
  icon: cpu
  color: orange
inputs:
  model:
    description: OpenCode provider/model identifier.
    required: true
  agent:
    description: Repository-defined OpenCode agent.
    required: false
    default: build
  prompt-file:
    description: Repository-relative prompt file for the frontier worker.
    required: false
    default: .github/opencode/frontier.md
  validation-command:
    description: Deterministic repository validation command.
    required: true
  trajectory-branch:
    description: Dedicated Git branch carrying the trajectory lease/state.
    required: false
    default: opencode/trajectory
  lease-seconds:
    description: Lease lifetime; must exceed the intended frontier runtime.
    required: false
    default: "690"
  opencode-version:
    description: Pinned OpenCode release version.
    required: false
    default: 1.18.35
  opencode-linux-x64-sha256:
    description: SHA-256 of the pinned OpenCode Linux x64 release asset.
    required: false
    default: c8f888b451f5494a18f858fffb0e0b68f4e4baa9c241761c5f206884f0fa640d
outputs:
  acquired:
    value: ${{ steps.lease.outputs.acquired }}
  attempt-id:
    value: ${{ steps.meta.outputs.attempt_id }}
  base-sha:
    value: ${{ steps.meta.outputs.base_sha }}
  candidate-sha:
    value: ${{ steps.publish.outputs.candidate_sha }}
  trajectory-sha:
    value: ${{ steps.lease.outputs.trajectory_sha }}
  pr-number:
    value: ${{ steps.publish.outputs.pr_number }}
  pr-url:
    value: ${{ steps.publish.outputs.pr_url }}
runs:
  using: composite
  steps:
    - name: Checkout caller repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false

    - id: meta
      name: Establish immutable attempt identity
      shell: bash
      run: |
        set -euo pipefail
        test "${RUNNER_OS}" = Linux
        base_sha="$(git rev-parse HEAD)"
        attempt_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
        echo "attempt_id=$attempt_id" >> "$GITHUB_OUTPUT"

    - name: Install pinned OpenCode
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
        OPENCODE_ASSET_SHA256: ${{ inputs.opencode-linux-x64-sha256 }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-opencode.sh" "$OPENCODE_VERSION" "$OPENCODE_ASSET_SHA256"

    - id: lease
      name: Acquire trajectory lease
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRAJECTORY_BRANCH: ${{ inputs.trajectory-branch }}
        LEASE_SECONDS: ${{ inputs.lease-seconds }}
        BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        ATTEMPT_ID: ${{ steps.meta.outputs.attempt_id }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap 'bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        lease_json="$(bash "$GITHUB_ACTION_PATH/scripts/trajectory.sh" acquire "$BASE_SHA" "$ATTEMPT_ID")"
        echo "$lease_json" | jq .
        acquired="$(jq -r .acquired <<<"$lease_json")"
        echo "acquired=$acquired" >> "$GITHUB_OUTPUT"
        if [[ "$acquired" == "true" ]]; then
          echo "lease_token=$(jq -r .lease_token <<<"$lease_json")" >> "$GITHUB_OUTPUT"
          echo "trajectory_sha=$(jq -r .trajectory_sha <<<"$lease_json")" >> "$GITHUB_OUTPUT"
        fi

    - name: Assert model receives no GitHub write credential
      if: ${{ steps.lease.outputs.acquired == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if git config --local --get-all http.https://github.com/.extraheader >/dev/null 2>&1; then
          echo "::error::GitHub credential header remained configured"
          exit 70
        fi

    - id: execute
      name: Execute and deterministically validate frontier pass
      if: ${{ steps.lease.outputs.acquired == 'true' }}
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        VALIDATION_COMMAND: ${{ inputs.validation-command }}
        ATTEMPT_ID: ${{ steps.meta.outputs.attempt_id }}
        EVIDENCE_DIR: .opencode-evidence
      run: bash "$GITHUB_ACTION_PATH/scripts/worker.sh"

    - id: publish
      name: Publish validated candidate
      if: ${{ steps.lease.outputs.acquired == 'true' && success() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ATTEMPT_ID: ${{ steps.meta.outputs.attempt_id }}
        BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        EVIDENCE_DIR: .opencode-evidence
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap 'bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        candidate="$(bash "$GITHUB_ACTION_PATH/scripts/publish.sh")"
        echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

        if [[ "$candidate" == "${BASE_SHA}" ]]; then
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "pr_url=" >> "$GITHUB_OUTPUT"
        else
          default_branch="$DEFAULT_BRANCH"
          branch_name="opencode/attempt/${ATTEMPT_ID}"
          python3 "$GITHUB_ACTION_PATH/scripts/publish.py"             --head "$branch_name"             --base "$default_branch"             --title "OpenCode frontier: ${ATTEMPT_ID}"             --body "Validated candidate from trajectory attempt ${ATTEMPT_ID}. Canonical admission is performed separately."             --output "$GITHUB_OUTPUT"
          pr_number="$(grep '^pr_number=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          pr_url="$(grep '^pr_url=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          jq --arg pr_number "$pr_number" --arg pr_url "$pr_url"             '.pr_number=$pr_number | .pr_url=$pr_url'             "$EVIDENCE_DIR/evidence.json" > "$EVIDENCE_DIR/evidence.tmp"
          mv "$EVIDENCE_DIR/evidence.tmp" "$EVIDENCE_DIR/evidence.json"
          sha256sum "$EVIDENCE_DIR/evidence.json" | awk '{print $1}' > "$EVIDENCE_DIR/evidence.sha256"
        fi

    - name: Upload attributable evidence
      if: ${{ always() && steps.lease.outputs.acquired == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opencode-evidence-${{ steps.meta.outputs.attempt_id }}
        path: .opencode-evidence/
        if-no-files-found: warn
        retention-days: 90

    - name: Finalize trajectory
      if: ${{ steps.lease.outputs.acquired == 'true' && success() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRAJECTORY_BRANCH: ${{ inputs.trajectory-branch }}
        TRAJECTORY_SHA: ${{ steps.lease.outputs.trajectory_sha }}
        LEASE_TOKEN: ${{ steps.lease.outputs.lease_token }}
        CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        ATTEMPT_ID: ${{ steps.meta.outputs.attempt_id }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap 'bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        bash "$GITHUB_ACTION_PATH/scripts/trajectory.sh" finalize "$TRAJECTORY_SHA" "$LEASE_TOKEN" validated "$CANDIDATE_SHA" "artifact:opencode-evidence-$ATTEMPT_ID"

    - name: Release failed trajectory lease
      if: ${{ failure() && steps.lease.outputs.acquired == 'true' && steps.lease.outputs.trajectory_sha != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRAJECTORY_BRANCH: ${{ inputs.trajectory-branch }}
        TRAJECTORY_SHA: ${{ steps.lease.outputs.trajectory_sha }}
        LEASE_TOKEN: ${{ steps.lease.outputs.lease_token }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap 'bash "$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        bash "$GITHUB_ACTION_PATH/scripts/trajectory.sh" finalize "$TRAJECTORY_SHA" "$LEASE_TOKEN" failed || true
