name: OpenCode Frontier Worker
description: Deterministic rotating OpenCode worker with CAS trajectory and SHA-bound evidence.
branding:
  icon: cpu
  color: orange
inputs:
  model:
    description: OpenCode provider/model identifier.
    required: true
  agent:
    description: Repository-defined OpenCode agent.
    required: false
    default: build
  prompt-file:
    description: Repository-relative prompt file for the frontier worker.
    required: false
    default: .github/opencode/frontier.md
  validation-command:
    description: Deterministic repository validation command.
    required: true
  trajectory-branch:
    description: Dedicated Git branch carrying the trajectory lease/state.
    required: false
    default: opencode/trajectory
  opencode-version:
    description: Pinned OpenCode release version.
    required: false
    default: 1.18.35
  opencode-linux-x64-sha256:
    description: SHA-256 of the pinned OpenCode Linux x64 release asset.
    required: false
    default: c8f888b451f5494a18f858fffb0e0b68f4e4baa9c241761c5f206884f0fa640d
outputs:
  attempt-id:
    value: ${{ steps.meta.outputs.attempt_id }}
  base-sha:
    value: ${{ steps.meta.outputs.base_sha }}
  candidate-sha:
    value: ${{ steps.publish.outputs.candidate_sha }}
  trajectory-sha:
    value: ${{ steps.lease.outputs.trajectory_sha }}
runs:
  using: composite
  steps:
    - name: Checkout caller repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false

    - id: meta
      name: Establish immutable attempt identity
      shell: bash
      run: |
        set -euo pipefail
        test "${RUNNER_OS}" = Linux
        base_sha="$(git rev-parse HEAD)"
        attempt_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
        echo "attempt_id=$attempt_id" >> "$GITHUB_OUTPUT"

    - name: Install pinned OpenCode
      shell: bash
      run: >-
        "$GITHUB_ACTION_PATH/scripts/install-opencode.sh"
        "${{ inputs.opencode-version }}"
        "${{ inputs.opencode-linux-x64-sha256 }}"

    - id: lease
      name: Acquire trajectory lease
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRAJECTORY_BRANCH: ${{ inputs.trajectory-branch }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap '"$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        lease_json="$("$GITHUB_ACTION_PATH/scripts/trajectory.sh" acquire "${{ steps.meta.outputs.base_sha }}" "${{ steps.meta.outputs.attempt_id }}")"
        echo "$lease_json" | jq .
        echo "lease_token=$(jq -r .lease_token <<<"$lease_json")" >> "$GITHUB_OUTPUT"
        echo "trajectory_sha=$(jq -r .trajectory_sha <<<"$lease_json")" >> "$GITHUB_OUTPUT"

    - name: Assert model receives no GitHub write credential
      shell: bash
      run: |
        set -euo pipefail
        if git config --local --get-all http.https://github.com/.extraheader >/dev/null 2>&1; then
          echo "::error::GitHub credential header remained configured"
          exit 70
        fi

    - id: execute
      name: Execute and deterministically validate frontier pass
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        VALIDATION_COMMAND: ${{ inputs.validation-command }}
        ATTEMPT_ID: ${{ steps.meta.outputs.attempt_id }}
        EVIDENCE_DIR: .opencode-evidence
      run: "$GITHUB_ACTION_PATH/scripts/worker.sh"

    - id: publish
      name: Publish validated candidate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ATTEMPT_ID: ${{ steps.meta.outputs.attempt_id }}
        BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        EVIDENCE_DIR: .opencode-evidence
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap '"$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        candidate="$("$GITHUB_ACTION_PATH/scripts/publish.sh")"
        echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

    - name: Finalize trajectory
      if: ${{ success() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRAJECTORY_BRANCH: ${{ inputs.trajectory-branch }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap '"$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        "$GITHUB_ACTION_PATH/scripts/trajectory.sh" finalize           "${{ steps.lease.outputs.trajectory_sha }}"           "${{ steps.lease.outputs.lease_token }}"           validated           "${{ steps.publish.outputs.candidate_sha }}"           "artifact:opencode-evidence-${{ steps.meta.outputs.attempt_id }}"

    - name: Release failed trajectory lease
      if: ${{ failure() && steps.lease.outputs.trajectory_sha != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRAJECTORY_BRANCH: ${{ inputs.trajectory-branch }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/git-auth.sh" enable
        trap '"$GITHUB_ACTION_PATH/scripts/git-auth.sh" disable' EXIT
        "$GITHUB_ACTION_PATH/scripts/trajectory.sh" finalize           "${{ steps.lease.outputs.trajectory_sha }}"           "${{ steps.lease.outputs.lease_token }}"           failed || true

    - name: Upload attributable evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opencode-evidence-${{ steps.meta.outputs.attempt_id }}
        path: .opencode-evidence/
        if-no-files-found: warn
        retention-days: 90
